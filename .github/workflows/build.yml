name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No KEYSTORE_B64 secret — release APK will be unsigned"; exit 0; fi
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/btcalert.jks
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore/keystore.properties

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      # assembleRelease only runs lintVital (fatal-severity issues). CLAUDE.md holds the project
      # to zero lint errors, so check the full set here rather than discovering drift locally.
      - name: Lint
        run: ./gradlew lintRelease --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release*.apk "BTCAlert-v${VER}.apk"
          echo "APK=BTCAlert-v${VER}.apk" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
